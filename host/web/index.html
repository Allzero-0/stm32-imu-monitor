<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM32 IMU 监控上位机</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #16213b;
    --panel2: #1c2a48;
    --line: #2a3a5e;
    --text: #e6edf7;
    --muted: #8fa3c4;
    --accent: #38bdf8;
    --x: #f87171;
    --y: #4ade80;
    --z: #60a5fa;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 4px 0; font-weight: 600; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 12px;
  }
  .stat { display: flex; flex-direction: column; min-width: 74px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 13px;
    transition: .15s;
  }
  button:hover { background: #26365c; border-color: var(--accent); }
  button.active { background: var(--accent); color: #06263a; border-color: var(--accent); font-weight: 600; }
  button.rec.active { background: var(--ok); color: #06301f; border-color: var(--ok); }
  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 12px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px;
  }
  .panel h2 {
    font-size: 13px; margin: 0 0 8px 0; color: var(--muted);
    font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
  }
  canvas { display: block; width: 100%; background: #0b1224; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .card { background: var(--panel2); border-radius: 8px; padding: 8px 10px; }
  .card .k { font-size: 11px; color: var(--muted); }
  .card .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card.x .v { color: var(--x); } .card.y .v { color: var(--y); } .card.z .v { color: var(--z); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 4px; vertical-align: middle; }
  .logs {
    margin-top: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; height: 110px; overflow-y: auto;
    font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--muted);
  }
  .logs div { padding: 1px 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 980px) { .row2 { grid-template-columns: 1fr; } }
  .dot { display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
</style>
</head>
<body>

<h1>STM32F103 + MPU6050 姿态采集监控系统</h1>
<div class="sub">下位机 200Hz 采样 / 100Hz 上传 · 二进制帧 + CRC8 · 互补滤波姿态解算</div>

<div class="bar">
  <div class="stat"><span class="k">数据源</span><span class="v" id="s-source">-</span></div>
  <div class="stat"><span class="k">帧率</span><span class="v" id="s-rate">0</span></div>
  <div class="stat"><span class="k">总帧数</span><span class="v" id="s-frames">0</span></div>
  <div class="stat"><span class="k">丢帧</span><span class="v" id="s-lost">0</span></div>
  <div class="stat"><span class="k">CRC错</span><span class="v" id="s-crc">0</span></div>
  <div class="stat"><span class="k">运行时长</span><span class="v" id="s-up">0s</span></div>
  <div class="stat"><span class="k">传感器</span><span class="v"><span class="dot warn" id="s-dot"></span><span id="s-mpu">-</span></span></div>
  <div class="spacer"></div>
  <button id="btn-cal">零点校准</button>
  <button id="btn-toggle">暂停上传</button>
  <button id="btn-status">请求状态</button>
  <button id="btn-reset">复位统计</button>
  <button id="btn-csv" class="rec">● 记录 CSV</button>
</div>

<div class="grid">
  <!-- 左：3D 姿态 -->
  <div class="panel">
    <h2>3D 姿态（实时）</h2>
    <canvas id="cube" width="660" height="520" style="height:260px"></canvas>
    <div class="cards">
      <div class="card x"><div class="k">ROLL (X)</div><div class="v" id="v-roll">0.0°</div></div>
      <div class="card y"><div class="k">PITCH (Y)</div><div class="v" id="v-pitch">0.0°</div></div>
      <div class="card z"><div class="k">YAW (Z)</div><div class="v" id="v-yaw">0.0°</div></div>
    </div>
    <div class="cards">
      <div class="card"><div class="k">MPU 温度</div><div class="v" id="v-temp">-.--°C</div></div>
      <div class="card"><div class="k">MCU 温度</div><div class="v" id="v-chip">-.--°C</div></div>
      <div class="card"><div class="k">主频</div><div class="v" id="v-clk">-</div></div>
    </div>
  </div>

  <!-- 右：曲线 -->
  <div>
    <div class="panel">
      <h2>加速度 (g)</h2>
      <canvas id="c-acc" width="1320" height="360" style="height:180px"></canvas>
      <div class="legend">
        <span><i style="background:var(--x)"></i>X</span>
        <span><i style="background:var(--y)"></i>Y</span>
        <span><i style="background:var(--z)"></i>Z</span>
        <span style="margin-left:auto">量程 ±2 g</span>
      </div>
    </div>
    <div class="row2">
      <div class="panel">
        <h2>角速度 (°/s)</h2>
        <canvas id="c-gyro" width="640" height="300" style="height:150px"></canvas>
        <div class="legend"><span>量程 ±250 °/s</span></div>
      </div>
      <div class="panel">
        <h2>ADC 原始值</h2>
        <canvas id="c-adc" width="640" height="300" style="height:150px"></canvas>
        <div class="legend">
          <span><i style="background:var(--x)"></i>外部0</span>
          <span><i style="background:var(--y)"></i>外部1</span>
          <span><i style="background:var(--z)"></i>内部温度</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="logs" id="logs"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
let lastFrames = [];
let paused = false;

/* ---------------------------------------------------------- 曲线绘制 */
function drawSeries(canvas, frames, keys, scale, colors) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // 背景网格
  ctx.strokeStyle = "#1b2745"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < 4; i++) { const y = H * i / 4; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // 零线
  ctx.strokeStyle = "#2f4270";
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();

  if (!frames.length) return;
  const n = frames.length;
  const step = W / Math.max(n - 1, 1);
  const mid = H / 2;
  const k = (H / 2) / scale;

  keys.forEach((key, idx) => {
    ctx.strokeStyle = colors[idx];
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      let v = frames[i][key];
      if (v === undefined) continue;
      let y = mid - v * k;
      if (y < 0) y = 0; if (y > H) y = H;
      const x = i * step;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  });
}

/* ------------------------------------------------- 3D 姿态板（开发板造型） */
function rotMatrix(roll, pitch, yaw) {
  const r = roll * Math.PI / 180, p = pitch * Math.PI / 180, y = yaw * Math.PI / 180;
  const cr = Math.cos(r), sr = Math.sin(r);
  const cp = Math.cos(p), sp = Math.sin(p);
  const cy = Math.cos(y), sy = Math.sin(y);
  // R = Rz(yaw) * Ry(pitch) * Rx(roll)
  return [
    [cy * cp, cy * sp * sr - sy * cr, cy * sp * cr + sy * sr],
    [sy * cp, sy * sp * sr + cy * cr, sy * sp * cr - cy * sr],
    [-sp, cp * sr, cp * cr]
  ];
}

function apply(R, v) {
  return [
    R[0][0] * v[0] + R[0][1] * v[1] + R[0][2] * v[2],
    R[1][0] * v[0] + R[1][1] * v[1] + R[1][2] * v[2],
    R[2][0] * v[0] + R[2][1] * v[1] + R[2][2] * v[2]
  ];
}

function drawCube(canvas, roll, pitch, yaw) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const S = Math.min(W, H) * 0.30;      // 缩放
  const R = rotMatrix(roll, pitch, yaw);

  // 开发板：长 2.0 x 宽 1.1 x 厚 0.12（机体系 X 长边、Y 短边、Z 法向）
  const a = 1.0, b = 0.55, t = 0.06;
  const verts = [
    [-a, -b, t], [a, -b, t], [a, b, t], [-a, b, t],
    [-a, -b, -t], [a, -b, -t], [a, b, -t], [-a, b, -t]
  ];
  const faces = [
    [0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4],
    [3, 2, 6, 7], [1, 2, 6, 5], [0, 3, 7, 4]
  ];
  const edges = [
    [0, 1], [1, 2], [2, 3], [3, 0],
    [4, 5], [5, 6], [6, 7], [7, 4],
    [0, 4], [1, 5], [2, 6], [3, 7]
  ];

  // 投影（弱透视）
  const proj = v => {
    const p = apply(R, v);
    const f = 1 / (1 + p[2] * 0.12);
    return [cx + p[0] * S * f, cy - p[1] * S * f];
  };

  // 面：按平均深度排序（画家算法），顶面偏亮
  const faceDepth = faces.map(f => {
    const zs = f.map(i => apply(R, verts[i])[2]);
    return zs.reduce((s, v) => s + v, 0) / zs.length;
  });
  const order = faces.map((f, i) => i).sort((i, j) => faceDepth[j] - faceDepth[i]);

  order.forEach(i => {
    const f = faces[i];
    const pts = f.map(idx => proj(verts[idx]));
    const depth = faceDepth[i];
    const shade = depth > 0 ? "#2f6ea8" : "#1d4a76";
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    ctx.fillStyle = shade;
    ctx.fill();
    ctx.strokeStyle = "#7fd0ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // 棱边高亮
  ctx.strokeStyle = "rgba(150,220,255,0.75)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  edges.forEach(e => {
    const p1 = proj(verts[e[0]]), p2 = proj(verts[e[1]]);
    ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
  });
  ctx.stroke();

  // 机体坐标轴：X 红 / Y 绿 / Z 蓝
  const axes = [
    { v: [1.35, 0, 0], c: "#f87171", label: "X" },
    { v: [0, 0.95, 0], c: "#4ade80", label: "Y" },
    { v: [0, 0, 0.95], c: "#60a5fa", label: "Z" }
  ];
  axes.forEach(ax => {
    const p0 = proj([0, 0, 0]);
    const p1 = proj(ax.v);
    ctx.strokeStyle = ax.c; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    ctx.fillStyle = ax.c;
    ctx.beginPath(); ctx.arc(p1[0], p1[1], 4, 0, Math.PI * 2); ctx.fill();
    ctx.font = "bold 14px Consolas";
    ctx.fillText(ax.label, p1[0] + 6, p1[1] - 4);
  });

  // 底部提示
  ctx.fillStyle = "#8fa3c4";
  ctx.font = "13px Consolas";
  ctx.fillText(`roll ${roll.toFixed(1)}°  pitch ${pitch.toFixed(1)}°  yaw ${yaw.toFixed(1)}°`, 12, H - 12);
}

/* ------------------------------------------------------------ 数据刷新 */
async function poll() {
  try {
    const res = await fetch("/api/data?n=300");
    const j = await res.json();
    const st = j.stats || {};
    $("s-source").textContent = st.source || "-";
    $("s-rate").textContent = (st.rate || 0) + " Hz";
    $("s-frames").textContent = st.frames || 0;
    $("s-lost").textContent = st.lost || 0;
    $("s-crc").textContent = st.crc || 0;
    $("s-up").textContent = (st.uptime || 0).toFixed(0) + "s";

    const mpuOk = (j.status && j.status.mpu_ok === 1);
    $("s-mpu").textContent = mpuOk ? "在线" : "未连接";
    $("s-dot").className = "dot " + (mpuOk ? "ok" : "bad");
    if (j.status && j.status.sysclk_hz) {
      $("v-clk").textContent = (j.status.sysclk_hz / 1e6).toFixed(0) + " MHz";
    }

    const f = j.frames || [];
    lastFrames = f;
    if (f.length) {
      const last = f[f.length - 1];
      $("v-roll").textContent = last.roll.toFixed(1) + "°";
      $("v-pitch").textContent = last.pitch.toFixed(1) + "°";
      $("v-yaw").textContent = last.yaw.toFixed(1) + "°";
      $("v-temp").textContent = last.temp.toFixed(1) + "°C";
      $("v-chip").textContent = last.chip.toFixed(1) + "°C";
      drawCube($("cube"), last.roll, last.pitch, last.yaw);
    }

    const C = ["#f87171", "#4ade80", "#60a5fa"];
    drawSeries($("c-acc"), f, ["ax", "ay", "az"], 2.0, C);
    drawSeries($("c-gyro"), f, ["gx", "gy", "gz"], 250, C);

    // ADC：把原始值归一化到 0..4095 显示
    const adcFrames = f.map(x => ({
      a0: (x.adc[0] / 4095) * 2 - 1,
      a1: (x.adc[1] / 4095) * 2 - 1,
      a2: (x.adc[2] / 4095) * 2 - 1
    }));
    drawSeries($("c-adc"), adcFrames, ["a0", "a1", "a2"], 1.0, C);

    // 日志
    const logs = j.logs || [];
    if (logs.length) {
      const box = $("logs");
      box.innerHTML = logs.slice(-20).reverse()
        .map(l => `<div>${new Date(l.t * 1000).toLocaleTimeString()} ${l.msg}</div>`).join("");
    }
  } catch (e) {
    $("s-source").textContent = "连接失败";
  }
}

/* ------------------------------------------------------------ 命令交互 */
function cmd(name) {
  fetch("/api/command", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cmd: name })
  });
}

$("btn-cal").onclick = () => { cmd("calibrate"); };
$("btn-status").onclick = () => { cmd("status"); };
$("btn-reset").onclick = () => { cmd("reset"); };
$("btn-toggle").onclick = () => {
  paused = !paused;
  $("btn-toggle").textContent = paused ? "继续上传" : "暂停上传";
  $("btn-toggle").classList.toggle("active", paused);
  cmd("toggle");
};
$("btn-csv").onclick = async () => {
  const on = !$("btn-csv").classList.contains("active");
  const res = await fetch("/api/csv", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enable: on })
  });
  const j = await res.json();
  $("btn-csv").classList.toggle("active", !!j.recording);
  $("btn-csv").textContent = j.recording ? "■ 停止记录" : "● 记录 CSV";
};

setInterval(poll, 100);
poll();
</script>
</body>
</html>
